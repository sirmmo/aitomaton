<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aitomaton</title>
<style>
:root{--bg:#f4f4f1;--fg:#1b1b19;--muted:#6a6a64;--card:#fff;--line:#e0e0d9;--accent:#2b5d8c;
--ok:#2a7a4b;--warn:#9a6200;--bad:#b3261e;--off:#85857e;--pre:#f0f0eb;--chip:#ecece6;--bar:#2b5d8c}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#e7e7e1;--muted:#9c9c94;--card:#1d1d1b;--line:#32322e;
--accent:#86b6e6;--ok:#6cc690;--warn:#e2ab4f;--bad:#f08a80;--off:#7a7a72;--pre:#111110;--chip:#2a2a27;--bar:#86b6e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:30px 0 10px;display:flex;gap:8px;align-items:center}
h2 .n{background:var(--chip);color:var(--fg);border-radius:99px;padding:0 8px;font-size:11px}
a{color:var(--accent)}.muted{color:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap}
.chip.on::before{content:"● ";color:var(--ok)}.chip.offc::before{content:"○ ";color:var(--off)}.chip.err::before{content:"● ";color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
.card{margin-bottom:10px}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top strong{font-size:15px}
.badge{font-size:11px;border-radius:99px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap;text-transform:lowercase}
.s-running,.s-dispatched,.s-done,.a-fix{color:var(--ok)}.s-waiting,.s-queued,.a-report,.s-reported{color:var(--warn)}
.s-failed,.s-ended,.l-fatal,.l-error{color:var(--bad)}.s-dry-run,.s-no-fix,.a-ignore,.a-watch,.l-info,.l-debug{color:var(--off)}
.l-warning{color:var(--warn)}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:6px}
pre{background:var(--pre);border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,monospace}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tr:last-child td{border-bottom:0}td.num{text-align:right;font-variant-numeric:tabular-nums}
.title{max-width:420px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.spark{display:inline-flex;align-items:flex-end;gap:1px;height:20px;vertical-align:middle}.spark i{display:block;width:4px;background:var(--bar);opacity:.75;min-height:1px;border-radius:1px}
.sev{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--chip);vertical-align:middle;overflow:hidden}.sev i{display:block;height:100%;background:var(--warn)}
.empty{color:var(--muted);padding:14px;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.tag{font-size:11px;background:var(--chip);border-radius:4px;padding:0 6px}
.trail{margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}
#err{color:var(--bad)}
.emergency{border:1px solid var(--bad);border-left-width:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.steps .arrow{color:var(--muted)}
.demo{margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--chip);font-size:13px}
</style>
</head>
<body>
<main>
<header>
  <h1>aitomaton <small id="ver"></small></h1>
  <div class="muted" id="when">loading…</div>
</header>
<div class="chips" id="chips"></div>
<div id="demo" class="demo" hidden></div>
<div id="err"></div>
<div class="stats" id="stats"></div>

<div id="em-wrap" hidden><h2 style="color:var(--bad)">Emergencies <span class="n" id="n-em">0</span></h2><div id="emergencies"></div></div>
<h2>Works <span class="n" id="n-works">0</span></h2><div id="works"></div>
<h2>Infrastructure <span class="n" id="n-infra">0</span></h2><div id="infra"></div>
<h2>Active findings <span class="n" id="n-findings">0</span></h2><div id="findings"></div>
<h2>Decisions <span class="n" id="n-decisions">0</span></h2><div id="decisions"></div>
<h2>Issues <span class="n" id="n-issues">0</span></h2><div id="issues"></div>
<h2>Architectures <span class="n" id="n-archs">0</span></h2><div id="archs"></div>
<h2>Services <span class="n" id="n-services">0</span></h2><div id="services"></div>
<p class="muted">Raw data: <a id="raw" href="status.json">status.json</a> · refreshes every 15 s</p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token = new URLSearchParams(location.search).get("token");
const src = "status.json" + (token ? "?token=" + encodeURIComponent(token) : "");
$("raw").href = src;
const ago = iso => { if (!iso) return "—"; const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return Math.max(0, Math.round(s)) + "s ago"; if (s < 3600) return Math.round(s/60) + "m ago";
  if (s < 86400) return Math.round(s/3600) + "h ago"; return Math.round(s/86400) + "d ago"; };
const badge = (t, cls) => `<span class="badge ${cls}">${esc(t)}</span>`;
const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text || url)}</a>` : "";
const spark = arr => { const m = Math.max(1, ...(arr || [0]));
  return `<span class="spark" title="${esc((arr||[]).join(" · "))}">` + (arr||[]).map(n => `<i style="height:${Math.round(n/m*20)}px"></i>`).join("") + "</span>"; };
const sev = v => `<span class="sev" title="${(v||0).toFixed(2)}"><i style="width:${Math.round((v||0)*100)}%"></i></span>`;
const empty = t => `<div class="empty">${esc(t)}</div>`;
const table = (head, rows) => rows.length ? `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>` : null;

function render(d) {
  $("ver").textContent = "v" + d.aitomaton;
  $("when").textContent = "last tick " + ago(d.last_tick) + " · generated " + new Date(d.generated_at).toLocaleTimeString();
  $("err").textContent = d.tick_error ? "Last tick failed: " + d.tick_error : "";
  if (d.demo) { $("demo").hidden = false; $("demo").innerHTML = 'Demo: synthetic swarm and errors, run through the real engine (<a href="../">about aitomaton</a>).'; }
  const c = d.config, s = d.sources;
  const chip = (label, on, err) => `<span class="chip ${err ? "err" : on ? "on" : "offc"}" title="${esc(err||"")}">${esc(label)}</span>`;
  $("chips").innerHTML = [
    chip("dispatch " + (c.dispatch ? "on" : "off (dry-run)"), c.dispatch),
    chip("decider: " + (c.decider === "chain" && c.chain ? c.chain.join(" → ") : c.decider), true),
    chip("sentry poll", s.sentry.enabled, s.sentry.error),
    chip("prometheus", s.prometheus.enabled, s.prometheus.error),
    chip("swarm · " + s.swarm.services + " services", !s.swarm.error && s.swarm.services, s.swarm.error),
    chip("laya", c.laya), chip("jev" + (c.jev && c.jev.model ? " · " + c.jev.model : ""), c.jev && c.jev.configured),
    chip("llm · " + c.llm.model, c.llm.configured),
    chip("stairway · " + c.executor.agent, c.executor.stairway), chip("pre-clone with service credentials", c.executor.prepares_clone),
    chip("default policy: " + c.default_policy, true),
    chip("direct actions " + (c.emergency && c.emergency.act ? "on" : "off"), c.emergency && c.emergency.act),
    chip("notify", c.emergency && c.emergency.notify),
    chip("infrastructure" + (c.infrastructure && c.infrastructure.repo ? " → " + c.infrastructure.repo : ""), c.infrastructure && c.infrastructure.enabled, d.infrastructure && d.infrastructure.error),
  ].join("");
  const w = d.summary.works;
  $("stats").innerHTML = [
    ["emergencies", d.summary.emergencies || 0], ["in progress", d.summary.in_progress], ["fixed (PR / push)", w.done], ["prepared (dry-run)", w["dry-run"]],
    ["active findings", d.summary.active_findings], ["decisions 24h", d.summary.decisions_24h], ["issues", d.summary.issues],
  ].map(([k, v]) => `<div class="stat"><b>${esc(v ?? 0)}</b><span>${esc(k)}</span></div>`).join("");

  // emergencies: what is down right now, the policy layer in force, the runbook so far
  const ems = d.emergencies || [];
  $("em-wrap").hidden = !ems.length; $("n-em").textContent = ems.length;
  $("emergencies").innerHTML = ems.map(e => {
    const done = Object.fromEntries((e.actions || []).map(a => [a.step, a]));
    const steps = (e.runbook || []).map(st => { const a = done[st];
      return badge(st + (a ? " · " + a.status : ""), a ? "s-" + a.status : "s-dry-run") + (a && a.note ? ` <span class="muted" style="font-size:12px">${esc(a.note)}</span>` : ""); });
    return `<div class="card emergency"><div class="top">${badge("emergency", "s-failed")} <strong>${esc(e.reason)}</strong></div>
      <div class="muted mono">${esc(e.issue)} · ${esc(e.service || "")} · since ${ago(e.since)} · policy ${esc(e.policy)}</div>
      <div class="steps">${steps.length ? `<span class="muted">runbook</span> ` + steps.join('<span class="arrow">→</span>') : '<span class="muted">no runbook step applies: a human has to act</span>'}</div></div>`; }).join("");

  const issueTitle = Object.fromEntries(d.issues.map(i => [i.key, i]));
  // works
  $("n-works").textContent = d.works.length;
  $("works").innerHTML = d.works.length ? d.works.slice(0, 30).map(x => {
    const i = issueTitle[x.issue] || {};
    return `<div class="card"><div class="top">${badge(x.status, "s-" + x.status)} ${badge(x.kind, "")}
      <strong>${esc(i.title || x.issue)}</strong></div>
      <div class="muted mono">${esc(x.issue)} · ${esc(x.executor)}${x.ref ? " · " + esc(x.ref) : ""} · updated ${ago(x.updated)}</div>
      <div class="tags">${x.url ? `<span class="tag">${link(x.url, "session")}</span>` : ""}${x.result_url ? `<span class="tag">${link(x.result_url, "result")}</span>` : ""}</div>
      ${x.summary ? `<p>${esc(x.summary)}</p>` : ""}
      <details><summary>log</summary><pre>${esc(x.log.map(e => `${e.at}  ${e.status}${e.note ? "  " + e.note : ""}`).join("\n"))}</pre></details>
      ${x.brief ? `<details><summary>${x.kind === "fix" ? "brief sent to the agent" : x.kind === "report" ? "report" : "details"}</summary><pre>${esc(x.brief)}</pre></details>` : ""}
    </div>`; }).join("") : empty("No works yet. Fixes and reports appear here once a decision calls for them.");

  // findings
  const act = d.findings.filter(f => f.active);
  $("n-findings").textContent = act.length;
  $("findings").innerHTML = act.length ? `<div class="grid">` + act.map(f => {
    const det = f.detail || {}, i = issueTitle[f.target];
    let body = "";
    if (f.kind === "burst") body = `${esc(det.window)} events now vs ${esc(det.expected)} expected · ×${esc(det.ratio)}`;
    else if (f.kind === "cascade") body = `services: ${esc((det.services||[]).join(", "))}<br>root: <b>${esc(det.root)}</b> (${esc(det.reason)})`;
    else if (f.kind === "rising") body = `trend ${(det.trend*100).toFixed(0)}%/day ${spark(det.daily)}`;
    else if (f.kind === "chronic") body = `active ${esc(det.days_active)} days`;
    else if (f.kind === "infrastructure") body = `${esc((det.condition || "").replace(/_/g, " "))} · ${esc(det.service || "")}`;
    else if (f.kind === "task_failures") body = `${esc(det.failed_tasks_1h)} failed tasks in 1h<br><span class="mono">${esc(det.error||"")}</span>`;
    else body = esc(det.service || "");
    return `<div class="card"><div class="top">${badge(f.kind, "")} ${badge(f.scope, "")} ${sev(f.severity)}</div>
      <div style="margin-top:6px;overflow-wrap:anywhere"><b>${esc(i ? i.title : f.target)}</b></div>
      <div class="muted" style="margin-top:4px">${body}</div>
      <div class="muted mono" style="margin-top:4px">since ${ago(f.first_at)}</div></div>`; }).join("") + "</div>"
    : empty("Nothing notable right now: no bursts, regressions, rising trends or cascades.");

  // infrastructure: the swarm itself, and where its issues go
  const inf = d.infrastructure || {};
  const conds = inf.conditions || [];
  $("n-infra").textContent = conds.length;
  if (!inf.enabled) $("infra").innerHTML = empty("Swarm health checks are off (AITOMATON_INFRA=0).");
  else {
    const o = inf.outlet || {}, m = inf.managers || {};
    const outlet = o.repo ? `${link("https://github.com/" + o.repo, o.repo)} <span class="muted mono">${esc(o.ref)}${o.path ? " · " + esc(o.path) : ""}</span> · policy ${badge(o.policy, o.policy === "observe" ? "a-watch" : o.policy === "report" ? "a-report" : "a-fix")} <span class="muted">${esc(o.git || "")}</span>`
      : `<span class="muted">no repository: infrastructure reports stay on this page (set AITOMATON_INFRA_REPO)</span>`;
    const byKind = {}; conds.forEach(c => byKind[c.kind] = (byKind[c.kind] || 0) + 1);
    $("infra").innerHTML = `<div class="card"><div class="top"><strong>${esc(inf.name)}</strong>
        ${badge(m.total ? `${m.reachable}/${m.total} managers · quorum ${m.quorum}` : "no manager view", m.total && m.reachable >= m.quorum ? "s-done" : "s-failed")}
        ${Object.entries(byKind).map(([k, n]) => badge(`${n} ${k.replace(/_/g, " ")}`, "l-error")).join(" ")}</div>
      <div style="margin-top:6px">outlet: ${outlet}</div>
      ${(inf.service_outlets || []).length ? `<div class="muted" style="margin-top:4px">per-service outlets: ${inf.service_outlets.map(r => esc(r)).join(", ")}</div>` : ""}
      ${inf.error ? `<div style="margin-top:4px;color:var(--bad)">${esc(inf.error)}</div>` : ""}
      ${(inf.advisories || []).length ? `<ul class="trail">${inf.advisories.map(a => `<li>${esc(a.text)}</li>`).join("")}</ul>` : ""}</div>` +
      (table(["node", "role", "state", "availability", "engine", "cpus", "memory"], (inf.nodes || []).map(n => `<tr>
        <td class="mono">${esc(n.hostname)}${n.leader ? ' <span class="tag">leader</span>' : ""}<div class="muted">${esc(n.addr || "")}</div></td>
        <td>${esc(n.role)}${n.reachability && n.reachability !== "reachable" ? " " + badge(n.reachability, "s-failed") : ""}</td>
        <td>${badge(n.state, n.state === "ready" ? "s-done" : "s-failed")}</td><td>${esc(n.availability)}</td>
        <td class="mono">${esc(n.engine)}</td><td class="num">${esc(n.cpus)}</td><td class="num">${esc(n.memory_gb)} GB</td></tr>`)) || "");
  }

  // decisions
  $("n-decisions").textContent = d.decisions.length;
  $("decisions").innerHTML = table(["when", "issue", "decided", "applied", "by", "conf.", "why"], d.decisions.slice(0, 50).map(x => {
    const i = issueTitle[x.issue] || {};
    return `<tr><td class="muted">${ago(x.at)}</td><td class="title">${esc(i.title || x.issue)}<div class="muted mono">${esc(i.service || "")}</div></td>
    <td>${badge(x.action, "a-" + x.action)}</td><td>${badge(x.applied, "a-" + x.applied)}<div class="muted mono">${esc(x.policy)}</div></td>
    <td>${esc(x.decider)}</td><td class="num">${(x.confidence ?? 0).toFixed(2)}</td>
    <td class="title">${esc(x.rationale)}${x.trail.length > 1 ? `<details><summary>${x.trail.length} tiers</summary><ul class="trail">${x.trail.map(t =>
      `<li><b>${esc(t.decider)}</b> → ${esc(t.action)} (${(t.confidence ?? 0).toFixed(2)}, code ${(t.code_defect ?? 0).toFixed(2)}): ${esc(t.rationale)}</li>`).join("")}</ul></details>` : ""}</td></tr>`; })) || empty("No decisions yet.");

  // issues
  $("n-issues").textContent = d.issues.length;
  $("issues").innerHTML = table(["level", "issue", "service", "1h", "24h", "users", "14 days", "flags", "last"], d.issues.map(i => {
    const a = i.analysis || {}, f = [];
    if (a.new) f.push("new"); if (a.regression) f.push("regression"); if (a.burst && a.burst.burst) f.push("burst ×" + a.burst.ratio);
    if (a.long_term && a.long_term.rising) f.push("rising"); else if (a.long_term && a.long_term.chronic) f.push("chronic");
    if (a.cascade) f.push(a.cascade_root ? "cascade root" : "cascade");
    if (i.emergency) f.push("emergency");
    if (i.decision) f.push("→ " + i.decision.applied);
    return `<tr><td>${badge(i.level || "?", "l-" + (i.level || ""))}</td>
      <td class="title">${i.url ? link(i.url, i.title) : esc(i.title)}<div class="muted mono">${esc(i.culprit || "")}</div></td>
      <td class="mono">${esc(i.service || "")}<div class="muted">${esc(i.architecture || "")}</div></td>
      <td class="num">${esc(a.events_1h ?? "")}</td><td class="num">${esc(a.events_24h ?? "")}</td><td class="num">${esc(i.users ?? "")}</td>
      <td>${a.long_term ? spark(a.long_term.daily) : ""}</td><td><div class="tags">${f.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></td>
      <td class="muted">${ago(i.last_seen)}</td></tr>`; })) || empty("No issues seen yet. Point Sentry/urgentry or Alertmanager webhooks here, or configure polling.");

  // architectures
  $("n-archs").textContent = d.architectures.length;
  $("archs").innerHTML = d.architectures.length ? `<div class="grid">` + d.architectures.map(a => `<div class="card">
    <div class="top"><strong>${esc(a.name)}</strong>${a.cascade ? badge("cascade", "s-failed") : ""}</div>
    <div class="muted">${esc(a.services)} services · ${esc(a.issues)} issues · ${esc(a.events_24h)} events 24h</div>
    ${a.cascade ? `<div style="margin-top:4px">root: <b>${esc(a.cascade.root)}</b> · ${esc(a.cascade.services.join(", "))}</div>` : ""}</div>`).join("") + "</div>"
    : empty("No architectures discovered.");

  // services
  const short = x => x.replicas && x.replicas.desired && x.replicas.running < x.replicas.desired;
  const svcs = d.services.filter(x => x.enabled || x.failed_tasks_1h || x.infra_repo || short(x));
  $("n-services").textContent = d.services.length;
  $("services").innerHTML = table(["service", "architecture", "repo", "policy", "git credential", "sentry", "replicas", "failed tasks 1h"], svcs.map(x => `<tr>
    <td class="mono">${esc(x.name)}</td><td>${esc(x.architecture)}</td>
    <td>${x.repo ? link("https://github.com/" + x.repo, x.repo) + ` <span class="muted mono">${esc(x.ref)}</span>` : '<span class="muted">—</span>'}${x.infra_repo ? `<div class="muted">infra: ${esc(x.infra_repo)}</div>` : ""}</td>
    <td>${badge(x.policy, x.policy === "observe" ? "a-watch" : x.policy === "report" ? "a-report" : "a-fix")}</td>
    <td class="muted" style="font-size:12px">${esc(x.git || "")}</td>
    <td class="mono">${esc((x.sentry_projects || []).join(", "))}</td>
    <td class="num">${x.replicas ? `<span class="${short(x) ? "l-error" : ""}">${esc(x.replicas.running)}/${esc(x.replicas.desired)}</span>` : '<span class="muted">global</span>'}</td>
    <td class="num">${esc(x.failed_tasks_1h || "")}</td></tr>`))
    || empty(`${d.services.length} services discovered, none enabled. Add aitomaton.* labels (or holodocker.repo) to a service.`);
}

async function load() {
  try {
    const r = await fetch(src, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) { $("err").textContent = "Could not load status.json: " + e.message; }
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
